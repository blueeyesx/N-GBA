
name: N-GBA - Native GUI v4

on:
  workflow_dispatch:
  push:
    paths:
      - "src/app.cc"
      - "src/window_server.cc"
      - "src/window_server.h"
      - "src/main.cpp"
      - "CMakeLists.txt"
      - "symbian.toml"
      - ".github/workflows/ngba-native-gui.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: S60v3-FP1-FP2-ARMv5T
            architecture: armv5t
            legacy: true

          - target: Symbian-Anna-ARMv6
            architecture: armv6
            legacy: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install symbian-platform
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install symbian-platform==0.3.0
          symbian doctor

      - name: Download Symbian SDK
        shell: bash
        run: |
          set -e

          curl -fL --retry 3 \
            "https://github.com/hpnkv/symbian-platform/releases/download/v0.3.0/symbian-sdk-0.3.0-linux-x86_64.tar.gz" \
            -o "$RUNNER_TEMP/symbian-sdk.tar.gz"

          test -s "$RUNNER_TEMP/symbian-sdk.tar.gz"

      - name: Install Symbian SDK
        shell: bash
        run: |
          set -e

          symbian sdk install "$HOME/dev/symbian-sdk" \
            --archive "$RUNNER_TEMP/symbian-sdk.tar.gz"

          symbian toolchain probe

      - name: Validate source files
        shell: bash
        run: |
          set -e

          for file in \
            src/app.cc \
            src/window_server.cc \
            src/window_server.h \
            symbian.toml
          do
            if [ ! -s "$file" ]; then
              echo "ERROR: Missing source file: $file"
              exit 1
            fi
          done

          echo "All required source files found."

      - name: Initialize Symbian project
        shell: bash
        run: |
          set -e

          PROJECT="$RUNNER_TEMP/ngba_native_gui"

          symbian init "$PROJECT" \
            --name ngba_native_gui \
            --architecture "${{ matrix.architecture }}" \
            --non-interactive

          test -d "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install N-GBA sources
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT/src"

          # Install the real N-GBA entry point.
          cp src/app.cc "$PROJECT/app.cc"

          # Install Window Server implementation.
          cp src/window_server.cc \
            "$PROJECT/src/window_server.cc"

          # Header is copied to both locations.
          # app.cc is in the project root.
          cp src/window_server.h \
            "$PROJECT/window_server.h"

          # window_server.cc is in src/.
          cp src/window_server.h \
            "$PROJECT/src/window_server.h"

          # Remove duplicate entry point copies.
          rm -f "$PROJECT/src/app.cc"
          rm -f "$PROJECT/src/main.cpp"

          echo "Root app.cc:"
          cat "$PROJECT/app.cc"

          echo "Root window_server.h:"
          ls -l "$PROJECT/window_server.h"

          echo "Source header:"
          ls -l "$PROJECT/src/window_server.h"

      - name: Configure CMake
        shell: bash
        run: |
          set -e

          cat > "$PROJECT/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.28)

          project(ngba_native_gui LANGUAGES CXX ASM)

          include(SymbianApp)

          symbian_add_executable(
              ngba_native_gui
              src/window_server.cc
          )

          target_link_libraries(
              ngba_native_gui
              PRIVATE
              Symbian::Stackless
              Symbian::WindowServer
              Symbian::Gdi
          )
          CMAKE

          echo "N-GBA CMake configuration:"
          cat "$PROJECT/CMakeLists.txt"

      - name: Configure Symbian metadata
        shell: bash
        run: |
          set -e

          cp symbian.toml "$PROJECT/symbian.toml"

          python - "$PROJECT/symbian.toml" \
            "${{ matrix.architecture }}" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          architecture = sys.argv[2]

          content = path.read_text()

          content, count = re.subn(
              r'(?m)^(\s*architecture\s*=\s*)"[^"]+"\s*$',
              lambda m: m.group(1) + '"' + architecture + '"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not set architecture in symbian.toml"
              )

          path.write_text(content)

          print(path.read_text())
          PY

      - name: Enable legacy EKA2 runtime
        if: matrix.legacy
        shell: bash
        run: |
          set -e

          python - "$PROJECT/CMakeLists.txt" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()

          marker = "include(SymbianApp)"

          if content.count(marker) != 1:
              raise SystemExit(
                  "ERROR: include(SymbianApp) not found exactly once"
              )

          setting = (
              'set(SYMBIAN_RUNTIME_LEGACY_EKA2 ON CACHE BOOL '
              '"ARMv5T older-ROM EKA2 runtime" FORCE)\n'
          )

          content = content.replace(
              marker,
              setting + marker,
              1
          )

          path.write_text(content)
          PY

      - name: Verify source layout
        shell: bash
        run: |
          set -e

          test -s "$PROJECT/app.cc"
          test -s "$PROJECT/window_server.h"
          test -s "$PROJECT/src/window_server.cc"
          test -s "$PROJECT/src/window_server.h"

          echo "Checking app.cc header..."
          grep -n '#include "window_server.h"' \
            "$PROJECT/app.cc"

          echo "Checking root header..."
          test -s "$PROJECT/window_server.h"

          echo "Checking src header..."
          test -s "$PROJECT/src/window_server.h"

          if [ -f "$PROJECT/src/app.cc" ]; then
            echo "ERROR: Duplicate app.cc found."
            exit 1
          fi

          if [ -f "$PROJECT/src/main.cpp" ]; then
            echo "ERROR: Old main.cpp found."
            exit 1
          fi

          echo "Source layout verification passed."

      - name: Clean build directory
        shell: bash
        run: |
          set -e

          rm -rf "$PROJECT/.symbian/build"
          rm -rf "$PROJECT/.symbian/package"

          echo "Build directory cleaned."

      - name: Build N-GBA
        shell: bash
        run: |
          set -e

          symbian app build --project "$PROJECT"

          EXE="$PROJECT/.symbian/build/ngba_native_gui.exe"

          if [ ! -s "$EXE" ]; then
            echo "ERROR: Executable not found."

            find "$PROJECT/.symbian" \
              -maxdepth 7 -type f || true

            exit 1
          fi

          echo "N-GBA executable generated:"
          ls -lh "$EXE"

      - name: Inspect E32 executable
        shell: bash
        run: |
          set -e

          EXE="$PROJECT/.symbian/build/ngba_native_gui.exe"

          symbian inspect --format e32 "$EXE" \
            | tee "$RUNNER_TEMP/ngba-e32-inspection.txt"

          if [ "${{ matrix.legacy }}" = "true" ]; then

            if grep -Eiq \
              'Dll: *(libc|libm|libpthread)\.dll' \
              "$RUNNER_TEMP/ngba-e32-inspection.txt"; then

              echo "ERROR: Unexpected Open C import."
              exit 1
            fi

            grep -Eiq 'Kernel: *eka2' \
              "$RUNNER_TEMP/ngba-e32-inspection.txt"

            grep -Eiq 'Architecture: *armv5t' \
              "$RUNNER_TEMP/ngba-e32-inspection.txt"
          fi

      - name: Package SIS
        shell: bash
        run: |
          set -e

          EXE="$PROJECT/.symbian/build/ngba_native_gui.exe"
          OUT="$PROJECT/.symbian/package"

          mkdir -p "$OUT"

          symbian package \
            --project "$PROJECT" \
            --artifact "$EXE" \
            --output "$OUT"

          SIS="$OUT/ngba_native_gui.sis"

          if [ ! -s "$SIS" ]; then
            echo "ERROR: SIS package not found."

            find "$PROJECT/.symbian" \
              -maxdepth 7 -type f || true

            exit 1
          fi

          echo "SIS package generated:"
          ls -lh "$SIS"

      - name: Inspect SIS
        shell: bash
        run: |
          set -e

          SIS="$PROJECT/.symbian/package/ngba_native_gui.sis"

          symbian inspect --format sis "$SIS" \
            | tee "$RUNNER_TEMP/ngba-sis-inspection.txt"

      - name: Upload N-GBA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N-GBA-Native-GUI-v4-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ngba_native_gui/.symbian/build/
            ${{ runner.temp }}/ngba_native_gui/.symbian/package/
            ${{ runner.temp }}/ngba-e32-inspection.txt
            ${{ runner.temp }}/ngba-sis-inspection.txt

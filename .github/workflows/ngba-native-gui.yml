
name: N-GBA - S60v3 Compatibility Build v7

on:
  workflow_dispatch:
  push:
    paths:
      - "src/app.cc"
      - "src/window_server.cc"
      - "src/window_server.h"
      - "symbian.toml"
      - ".github/workflows/ngba-native-gui.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: S60v3-FP1-FP2-ARMv5T
            architecture: armv5t
            legacy: true
          - target: Symbian-Anna-ARMv6
            architecture: armv6
            legacy: false

    steps:
      - name: Checkout N-GBA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Symbian Platform
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install symbian-platform==0.3.0
          symbian doctor

      - name: Download Symbian SDK
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 \
            "https://github.com/hpnkv/symbian-platform/releases/download/v0.3.0/symbian-sdk-0.3.0-linux-x86_64.tar.gz" \
            -o "$RUNNER_TEMP/symbian-sdk.tar.gz"

          test -s "$RUNNER_TEMP/symbian-sdk.tar.gz"
          ls -lh "$RUNNER_TEMP/symbian-sdk.tar.gz"

      - name: Install SDK
        shell: bash
        run: |
          set -e
          symbian sdk install "$HOME/dev/symbian-sdk" \
            --archive "$RUNNER_TEMP/symbian-sdk.tar.gz"

          symbian toolchain probe

      - name: Validate N-GBA source
        shell: bash
        run: |
          set -e

          for file in \
            src/app.cc \
            src/window_server.cc \
            src/window_server.h \
            symbian.toml
          do
            if [ ! -s "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
          done

          grep -q "GuiWindowServerMain" src/app.cc
          grep -q "RFs" src/window_server.cc
          grep -q "RWsSession" src/window_server.cc
          grep -q "GetDir" src/window_server.cc

          echo "N-GBA source validation passed."

      - name: Initialize build project
        shell: bash
        run: |
          set -e

          PROJECT="$RUNNER_TEMP/ngba_native_gui"

          symbian init "$PROJECT" \
            --name ngba_native_gui \
            --architecture "${{ matrix.architecture }}" \
            --non-interactive

          test -d "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Copy N-GBA source
        shell: bash
        run: |
          set -e

          cp src/app.cc "$PROJECT/app.cc"
          cp src/window_server.cc "$PROJECT/window_server.cc"
          cp src/window_server.h "$PROJECT/window_server.h"

          echo "N-GBA source copied."

      - name: Configure native GUI build
        shell: bash
        run: |
          set -e

          cat > "$PROJECT/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.28)

          project(ngba_native_gui LANGUAGES CXX ASM)

          include(SymbianApp)

          symbian_add_executable(
              ngba_native_gui
              app.cc
              window_server.cc
          )

          target_link_libraries(
              ngba_native_gui
              PRIVATE
              Symbian::Stackless
              Symbian::WindowServer
              Symbian::Gdi
              Symbian::FileServer
          )
          CMAKE

          cat "$PROJECT/CMakeLists.txt"

      - name: Enable legacy EKA2 runtime
        if: matrix.legacy
        shell: bash
        run: |
          set -e

          python - "$PROJECT/CMakeLists.txt" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()

          marker = "include(SymbianApp)"

          if content.count(marker) != 1:
              raise SystemExit("CMake marker not found.")

          setting = (
              'set(SYMBIAN_RUNTIME_LEGACY_EKA2 ON CACHE BOOL '
              '"ARMv5T older-ROM EKA2 runtime" FORCE)\n'
          )

          path.write_text(content.replace(marker, setting + marker, 1))
          print("Legacy EKA2 runtime enabled.")
          PY

      - name: Configure target metadata
        shell: bash
        run: |
          set -e

          cp symbian.toml "$PROJECT/symbian.toml"

          python - "$PROJECT/symbian.toml" \
            "${{ matrix.architecture }}" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          architecture = sys.argv[2]
          content = path.read_text()

          content, count = re.subn(
              r'(?m)^(\s*architecture\s*=\s*)"[^\"]+"\s*$',
              lambda m: m.group(1) + '"' + architecture + '"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Architecture setting not found.")

          path.write_text(content)
          print(path.read_text())
          PY

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -s "$PROJECT/app.cc"
          test -s "$PROJECT/window_server.cc"
          test -s "$PROJECT/window_server.h"
          test -s "$PROJECT/symbian.toml"

          grep -q "GuiWindowServerMain" "$PROJECT/app.cc"
          grep -q "Symbian::WindowServer" "$PROJECT/CMakeLists.txt"
          grep -q "Symbian::FileServer" "$PROJECT/CMakeLists.txt"

          echo "Project verification passed."

      - name: Clean previous build
        shell: bash
        run: |
          set -e

          rm -rf "$PROJECT/.symbian/build"
          rm -rf "$PROJECT/.symbian/package"

      - name: Build N-GBA
        shell: bash
        run: |
          set -e

          symbian app build --project "$PROJECT"

          EXE="$PROJECT/.symbian/build/ngba_native_gui.exe"

          if [ ! -s "$EXE" ]; then
            echo "ERROR: E32 executable not generated."
            find "$PROJECT/.symbian" -maxdepth 8 -type f || true
            exit 1
          fi

          ls -lh "$EXE"

      - name: Inspect E32 executable
        shell: bash
        run: |
          set -e

          EXE="$PROJECT/.symbian/build/ngba_native_gui.exe"

          symbian inspect --format e32 "$EXE" \
            | tee "$RUNNER_TEMP/ngba-e32-inspection.txt"

      - name: Check ARMv5T target
        if: matrix.legacy
        shell: bash
        run: |
          set -e

          REPORT="$RUNNER_TEMP/ngba-e32-inspection.txt"

          grep -Eiq 'Kernel: *eka2' "$REPORT"
          grep -Eiq 'Architecture: *armv5t' "$REPORT"

          if grep -Eiq \
            'Dll: *(libc|libm|libpthread)\.dll' "$REPORT"; then
            echo "ERROR: Unexpected Open C dependency."
            exit 1
          fi

          echo "ARMv5T EKA2 metadata check passed."

      - name: Package SIS
        shell: bash
        run: |
          set -e

          EXE="$PROJECT/.symbian/build/ngba_native_gui.exe"
          OUT="$PROJECT/.symbian/package"

          mkdir -p "$OUT"

          symbian package \
            --project "$PROJECT" \
            --artifact "$EXE" \
            --output "$OUT"

          SIS="$OUT/ngba_native_gui.sis"

          if [ ! -s "$SIS" ]; then
            echo "ERROR: SIS package not generated."
            find "$PROJECT/.symbian" -maxdepth 8 -type f || true
            exit 1
          fi

          ls -lh "$SIS"

      - name: Inspect SIS package
        shell: bash
        run: |
          set -e

          SIS="$PROJECT/.symbian/package/ngba_native_gui.sis"

          symbian inspect --format sis "$SIS" \
            | tee "$RUNNER_TEMP/ngba-sis-inspection.txt"

      - name: Create build report
        if: always()
        shell: bash
        run: |
          {
            echo "N-GBA compatibility build"
            echo "Target: ${{ matrix.target }}"
            echo "Architecture: ${{ matrix.architecture }}"
            echo "Legacy EKA2: ${{ matrix.legacy }}"
            echo "Build date: $(date -u)"
            echo
            echo "This report does not prove physical-device compatibility."
          } > "$RUNNER_TEMP/ngba-build-report.txt"

      - name: Upload N-GBA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N-GBA-v7-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ngba_native_gui/.symbian/build/
            ${{ runner.temp }}/ngba_native_gui/.symbian/package/
            ${{ runner.temp }}/ngba-e32-inspection.txt
            ${{ runner.temp }}/ngba-sis-inspection.txt
            ${{ runner.temp }}/ngba-build-report.txt

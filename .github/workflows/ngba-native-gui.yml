
name: N-GBA - Nokia E6 Native GUI

on:
  workflow_dispatch:
  push:
    paths:
      - "src/app.cc"
      - "src/window_server.cc"
      - "src/window_server.h"
      - "src/rom_loader.cc"
      - "src/rom_loader.h"
      - "src/arm7tdmi.cc"
      - "src/arm7tdmi.h"
      - "src/gba_memory.cc"
      - "src/gba_memory.h"
      - "src/gba_ppu.cc"
      - "src/gba_ppu.h"
      - "src/gba_screen_view.cc"
      - "src/gba_screen_view.h"
      - "src/cpu_selftest.cc"
      - "src/cpu_selftest.h"
      - "src/main.cpp"
      - "CMakeLists.txt"
      - "symbian.toml"
      - ".github/workflows/ngba-native-gui.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Nokia E6 - Symbian Anna ARMv6
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Nokia-E6-Symbian-Anna-ARMv6
            architecture: armv6
            legacy: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install symbian-platform
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install symbian-platform==0.3.0
          symbian doctor

      - name: Download Symbian SDK
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 \
            "https://github.com/hpnkv/symbian-platform/releases/download/v0.3.0/symbian-sdk-0.3.0-linux-x86_64.tar.gz" \
            -o "$RUNNER_TEMP/symbian-sdk.tar.gz"
          test -s "$RUNNER_TEMP/symbian-sdk.tar.gz"

      - name: Install Symbian SDK
        shell: bash
        run: |
          set -e
          symbian sdk install "$HOME/dev/symbian-sdk" \
            --archive "$RUNNER_TEMP/symbian-sdk.tar.gz"
          symbian toolchain probe

      - name: Validate source files
        shell: bash
        run: |
          set -e

          for file in \
            src/app.cc \
            src/window_server.cc \
            src/window_server.h \
            src/rom_loader.cc \
            src/rom_loader.h \
            src/arm7tdmi.cc \
            src/arm7tdmi.h \
            src/gba_memory.cc \
            src/gba_memory.h \
            src/gba_ppu.cc \
            src/gba_ppu.h \
            src/gba_screen_view.h \
            src/gba_screen_view.cc \
            src/cpu_selftest.cc \
            src/cpu_selftest.h \
            symbian.toml
          do
            test -s "$file" || {
              echo "ERROR: Missing $file"
              exit 1
            }
          done

          echo "All source files are present."

      - name: Initialize Symbian project
        shell: bash
        run: |
          set -e

          PROJECT="$RUNNER_TEMP/ngba_native_gui"

          symbian init "$PROJECT" \
            --name ngba_native_gui \
            --architecture "${{ matrix.architecture }}" \
            --non-interactive

          test -d "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install N-GBA sources
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT/src"

          cp src/app.cc "$PROJECT/app.cc"

          cp src/window_server.cc \
            "$PROJECT/src/window_server.cc"

          cp src/window_server.h \
            "$PROJECT/window_server.h"

          cp src/window_server.h \
            "$PROJECT/src/window_server.h"

          cp src/rom_loader.h \
            "$PROJECT/src/rom_loader.h"

          cp src/rom_loader.cc \
            "$PROJECT/src/rom_loader.cc"

          cp src/arm7tdmi.h \
            "$PROJECT/src/arm7tdmi.h"

          cp src/arm7tdmi.cc \
            "$PROJECT/src/arm7tdmi.cc"

          cp src/gba_memory.h \
            "$PROJECT/src/gba_memory.h"

          cp src/gba_memory.cc \
            "$PROJECT/src/gba_memory.cc"

          cp src/gba_ppu.h \
            "$PROJECT/src/gba_ppu.h"

          cp src/gba_ppu.cc \
            "$PROJECT/src/gba_ppu.cc"

          cp src/gba_screen_view.h \
            "$PROJECT/src/gba_screen_view.h"

          cp src/gba_screen_view.cc \
            "$PROJECT/src/gba_screen_view.cc"

          cp src/cpu_selftest.h \
            "$PROJECT/src/cpu_selftest.h"

          cp src/cpu_selftest.cc \
            "$PROJECT/src/cpu_selftest.cc"

          rm -f "$PROJECT/src/app.cc"
          rm -f "$PROJECT/src/main.cpp"

          echo "All N-GBA sources installed."

      - name: Remove unsupported TRAPD implementation
        shell: bash
        run: |
          set -e

          python - "$PROJECT/src/window_server.cc" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()

          marker = "int GuiWindowServerMain()"

          if content.count(marker) != 1:
              raise SystemExit(
                  "ERROR: GuiWindowServerMain() not found exactly once."
              )

          prefix = content.split(marker, 1)[0]

          replacement = """int GuiWindowServerMain() {
              return RunWindowServer();
          }
          """

          path.write_text(prefix + replacement)

          print("Patched GuiWindowServerMain().")
          PY

          if grep -nE 'TRAPD|CTrapCleanup|TTrap' \
            "$PROJECT/src/window_server.cc"; then
            echo "ERROR: Unsupported trap implementation remains."
            exit 1
          fi

          echo "TRAPD removal verified."

      - name: Patch memcmp for Symbian SDK
        shell: bash
        run: |
          set -e

          python - "$PROJECT/src/gba_memory.cc" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")

          patch = """static inline int ngba_memcmp(const void* a, const void* b, unsigned int n)
          {
              const unsigned char* p1 = static_cast<const unsigned char*>(a);
              const unsigned char* p2 = static_cast<const unsigned char*>(b);
              for (unsigned int i = 0; i < n; ++i)
              {
                  if (p1[i] != p2[i])
                  {
                      return static_cast<int>(p1[i]) - static_cast<int>(p2[i]);
                  }
              }
              return 0;
          }
          #ifndef memcmp
          #define memcmp ngba_memcmp
          #endif

          """

          if "ngba_memcmp" not in content:
              marker = '#include <e32std.h>\n'
              if marker in content:
                  content = content.replace(marker, marker + patch, 1)
              else:
                  content = patch + content
              path.write_text(content, encoding="utf-8")

          print("Patched memcmp() with inline ngba_memcmp in gba_memory.cc.")
          PY

          grep -q 'ngba_memcmp' "$PROJECT/src/gba_memory.cc"
          echo "memcmp inline patch verified."

      - name: Configure CMake
        shell: bash
        run: |
          set -e

          cat > "$PROJECT/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.28)

          project(ngba_native_gui LANGUAGES CXX ASM)

          include(SymbianApp)

          symbian_add_executable(
              ngba_native_gui
              src/window_server.cc
              src/rom_loader.cc
              src/arm7tdmi.cc
              src/gba_memory.cc
              src/gba_ppu.cc
              src/gba_screen_view.cc
              src/cpu_selftest.cc
          )

          target_link_libraries(
              ngba_native_gui
              PRIVATE
              Symbian::Stackless
              Symbian::WindowServer
              Symbian::Gdi
              Symbian::BitmapGdi
              Symbian::FontStore
              Symbian::FileServer
          )

          target_compile_options(
              ngba_native_gui
              PRIVATE
              -O2
              -fno-strict-aliasing
          )
          CMAKE

          cat "$PROJECT/CMakeLists.txt"

      - name: Configure Symbian metadata
        shell: bash
        run: |
          set -e

          cp symbian.toml "$PROJECT/symbian.toml"

          python - "$PROJECT/symbian.toml" \
            "${{ matrix.architecture }}" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          architecture = sys.argv[2]

          content = path.read_text()

          content, count = re.subn(
              r'(?m)^(\s*architecture\s*=\s*)"[^"]+"\s*$',
              lambda m: m.group(1) + '"' + architecture + '"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Architecture setting not found."
              )

          path.write_text(content)
          print(path.read_text())
          PY

      - name: Verify sources
        shell: bash
        run: |
          set -e

          test -s "$PROJECT/app.cc"
          test -s "$PROJECT/src/window_server.cc"
          test -s "$PROJECT/src/window_server.h"
          test -s "$PROJECT/src/rom_loader.h"
          test -s "$PROJECT/src/rom_loader.cc"
          test -s "$PROJECT/src/arm7tdmi.h"
          test -s "$PROJECT/src/arm7tdmi.cc"
          test -s "$PROJECT/src/gba_memory.h"
          test -s "$PROJECT/src/gba_memory.cc"
          test -s "$PROJECT/src/gba_ppu.h"
          test -s "$PROJECT/src/gba_ppu.cc"
          test -s "$PROJECT/src/gba_screen_view.h"
          test -s "$PROJECT/src/gba_screen_view.cc"
          test -s "$PROJECT/src/cpu_selftest.h"
          test -s "$PROJECT/src/cpu_selftest.cc"

          grep -q 'GuiWindowServerMain' "$PROJECT/app.cc"
          grep -q 'NgbaLoadRom' "$PROJECT/src/rom_loader.cc"
          grep -q 'NgbaCpuReset' "$PROJECT/src/arm7tdmi.cc"
          grep -q 'NgbaCpuStep' "$PROJECT/src/arm7tdmi.cc"
          grep -q 'NgbaMemoryInit' "$PROJECT/src/gba_memory.cc"
          grep -q 'NgbaMemoryRead32' "$PROJECT/src/gba_memory.cc"
          grep -q 'NgbaMemoryWrite32' "$PROJECT/src/gba_memory.cc"
          grep -q 'NgbaCpuRunSelfTests' "$PROJECT/src/cpu_selftest.cc"
          grep -q 'NgbaCpuRunSelfTests' "$PROJECT/src/rom_loader.cc"
          grep -q 'NgbaPpuRunFrame' "$PROJECT/src/gba_ppu.cc"
          grep -q 'NgbaPpuGetFrameBufferRgb555' "$PROJECT/src/gba_ppu.cc"

          grep -q 'NgbaScreenViewInitialize' \
            "$PROJECT/src/gba_screen_view.cc"

          grep -q 'NgbaScreenViewDraw' \
            "$PROJECT/src/gba_screen_view.cc"

          grep -q 'LoadLanguageMode' \
            "$PROJECT/src/window_server.cc"

          grep -q 'SaveLanguageMode' \
            "$PROJECT/src/window_server.cc"

          grep -q 'NgbaLoadRom' \
            "$PROJECT/src/window_server.cc"

          grep -q 'NgbaReleaseRom' \
            "$PROJECT/src/window_server.cc"

          if [ -f "$PROJECT/src/app.cc" ]; then
            echo "ERROR: Duplicate app.cc."
            exit 1
          fi

          if grep -nE 'TRAPD|CTrapCleanup|TTrap' \
            "$PROJECT/src/window_server.cc"; then
            echo "ERROR: Unsupported trap symbols detected."
            exit 1
          fi

          echo "Source verification passed."

      - name: Clean build
        shell: bash
        run: |
          set -e
          rm -rf "$PROJECT/.symbian/build"
          rm -rf "$PROJECT/.symbian/package"

      - name: Build N-GBA for Nokia E6
        shell: bash
        run: |
          set -e

          symbian app build --project "$PROJECT"

          EXE="$PROJECT/.symbian/build/ngba_native_gui.exe"

          if [ ! -s "$EXE" ]; then
            echo "ERROR: Executable not generated."
            find "$PROJECT/.symbian" \
              -maxdepth 7 -type f || true
            exit 1
          fi

          echo "Executable generated:"
          ls -lh "$EXE"

      - name: Inspect E32 executable
        shell: bash
        run: |
          set -e

          EXE="$PROJECT/.symbian/build/ngba_native_gui.exe"

          symbian inspect --format e32 "$EXE" \
            | tee "$RUNNER_TEMP/ngba-e32-inspection.txt"

      - name: Package SIS
        shell: bash
        run: |
          set -e

          EXE="$PROJECT/.symbian/build/ngba_native_gui.exe"
          OUT="$PROJECT/.symbian/package"

          mkdir -p "$OUT"

          symbian package \
            --project "$PROJECT" \
            --artifact "$EXE" \
            --output "$OUT"

          SIS="$OUT/ngba_native_gui.sis"

          if [ ! -s "$SIS" ]; then
            echo "ERROR: SIS not generated."
            find "$PROJECT/.symbian" \
              -maxdepth 7 -type f || true
            exit 1
          fi

          ls -lh "$SIS"

      - name: Inspect SIS
        shell: bash
        run: |
          set -e

          SIS="$PROJECT/.symbian/package/ngba_native_gui.sis"

          symbian inspect --format sis "$SIS" \
            | tee "$RUNNER_TEMP/ngba-sis-inspection.txt"

      - name: Upload N-GBA Nokia E6 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N-GBA-Nokia-E6-Symbian-Anna-ARMv6
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ngba_native_gui/.symbian/build/
            ${{ runner.temp }}/ngba_native_gui/.symbian/package/
            ${{ runner.temp }}/ngba-e32-inspection.txt
            ${{ runner.temp }}/ngba-sis-inspection.txt

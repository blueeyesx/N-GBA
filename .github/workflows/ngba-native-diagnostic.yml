
name: N-GBA Native Compatibility Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "diagnostic/**"
      - ".github/workflows/ngba-native-diagnostic.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Native Symbian Diagnostic
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: s60v3
            sdk_variable: SYMBIAN_FP1_SDK_URL
            target: gcce
            output: N-GBA-Diagnostic-S60v3.sis

          - profile: anna
            sdk_variable: SYMBIAN_ANNA_SDK_URL
            target: gcce
            output: N-GBA-Diagnostic-Anna.sis

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate SDK configuration
        shell: pwsh
        env:
          FP1_URL: ${{ vars.SYMBIAN_FP1_SDK_URL }}
          ANNA_URL: ${{ vars.SYMBIAN_ANNA_SDK_URL }}
        run: |
          $url = if ("${{ matrix.profile }}" -eq "s60v3") {
            $env:FP1_URL
          } else {
            $env:ANNA_URL
          }

          if ([string]::IsNullOrWhiteSpace($url)) {
            throw "SDK URL for ${{ matrix.profile }} is not configured."
          }

      - name: Download SDK archive
        shell: pwsh
        env:
          FP1_URL: ${{ vars.SYMBIAN_FP1_SDK_URL }}
          ANNA_URL: ${{ vars.SYMBIAN_ANNA_SDK_URL }}
        run: |
          $url = if ("${{ matrix.profile }}" -eq "s60v3") {
            $env:FP1_URL
          } else {
            $env:ANNA_URL
          }

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "$env:RUNNER_TEMP\symbian-sdk.zip"

      - name: Extract SDK
        shell: pwsh
        run: |
          $sdk = "$env:RUNNER_TEMP\symbian-sdk"
          New-Item -ItemType Directory -Force $sdk | Out-Null

          Expand-Archive `
            -Path "$env:RUNNER_TEMP\symbian-sdk.zip" `
            -DestinationPath $sdk `
            -Force

          $epoc = Get-ChildItem $sdk -Directory -Recurse |
            Where-Object { $_.Name -ieq "epoc32" } |
            Select-Object -First 1

          if (-not $epoc) {
            throw "SDK archive does not contain epoc32."
          }

          $root = Split-Path $epoc.FullName -Parent
          $root = $root.TrimEnd('\') + '\'

          "EPOCROOT=$root" | Out-File $env:GITHUB_ENV -Append
          "SDKROOT=$root" | Out-File $env:GITHUB_ENV -Append

      - name: Configure Symbian environment
        shell: pwsh
        run: |
          $root = $env:SDKROOT

          $paths = @(
            "$root\epoc32\tools",
            "$root\epoc32\gcc\bin",
            "$root\epoc32\release\gcce\urel",
            "$root\tools"
          )

          foreach ($p in $paths) {
            if (Test-Path $p) {
              $env:PATH = "$p;$env:PATH"
            }
          }

          if (-not (Get-Command bldmake -ErrorAction SilentlyContinue)) {
            throw "bldmake is missing from SDK."
          }

          if (-not (Get-Command abld -ErrorAction SilentlyContinue)) {
            throw "abld is missing from SDK."
          }

          if (-not (Get-Command makesis -ErrorAction SilentlyContinue)) {
            throw "makesis is missing from SDK."
          }

      - name: Build native application
        shell: cmd
        run: |
          cd diagnostic\common\group
          bldmake bldfiles
          if errorlevel 1 exit /b 1

          abld build %GCCE_TARGET% urel
          if errorlevel 1 exit /b 1
        env:
          GCCE_TARGET: ${{ matrix.target }}

      - name: Package SIS
        shell: pwsh
        run: |
          $pkg = "diagnostic\common\group\ngba_diagnostic.pkg"

          makesis $pkg

          $sis = "diagnostic\common\group\ngba_diagnostic.sis"

          if (!(Test-Path $sis)) {
            throw "SIS package was not generated."
          }

          New-Item -ItemType Directory -Force `
            "artifacts\${{ matrix.profile }}" | Out-Null

          Copy-Item $sis `
            "artifacts\${{ matrix.profile }}\${{ matrix.output }}"

      - name: Upload diagnostic SIS
        uses: actions/upload-artifact@v4
        with:
          name: N-GBA-Diagnostic-${{ matrix.profile }}
          path: artifacts/${{ matrix.profile }}/*.sis
          if-no-files-found: error
          retention-days: 14

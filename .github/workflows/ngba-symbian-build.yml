
name: N-GBA Symbian Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'core/**'
      - 'ui/**'
      - 'tests/**'
      - '.github/workflows/ngba-symbian-build.yml'

permissions:
  contents: read

jobs:
  host-build:
    name: Build and test N-GBA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DNGBA_HOST_TESTS=ON

      - name: Compile
        run: cmake --build build --parallel 2

      - name: Run tests
        run: |
          ctest --test-dir build \
            --output-on-failure

  symbian-probe:
    name: Check Symbian toolchain
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install symbian-platform
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install symbian-platform==0.3.0

      - name: Check platform
        run: |
          source .venv/bin/activate
          symbian doctor
          symbian toolchain probe

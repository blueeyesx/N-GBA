name: Extract ZIP to Repository

on:
  push:
    paths:
      - 'N-GBA-StellarDragon-mGBA-Integration.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP contents to root
        shell: bash
        run: |
          ZIP_FILE="N-GBA-StellarDragon-mGBA-Integration.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "File $ZIP_FILE tidak ditemukan di root repository."
            exit 1
          fi

          mkdir -p _temp_extract
          unzip -q "$ZIP_FILE" -d _temp_extract
          rm -rf _temp_extract/N-GBA-StellarDragon/.github/workflows

          shopt -s dotglob nullglob
          cp -rf _temp_extract/N-GBA-StellarDragon/* .
          rm -rf _temp_extract
          rm -f "$ZIP_FILE"

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan baru untuk di-commit."
          else
            git commit -m "Extract N-GBA-StellarDragon-mGBA-Integration.zip to repository"
            git push
          fi

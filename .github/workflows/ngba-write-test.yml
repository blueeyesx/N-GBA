
name: N-GBA Repository Write Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create write test report
        run: |
          mkdir -p build
          echo "N-GBA GitHub Actions write test successful." > build/write-test.txt
          echo "Date: $(date -u)" >> build/write-test.txt

      - name: Commit report
        run: |
          git add build/write-test.txt
          if ! git diff --cached --quiet; then
            git commit -m "Test GitHub Actions repository write access"
            git push
          else
            echo "No changes to commit."
          fi

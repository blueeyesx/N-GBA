name: N-GBA CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ zip git
      - run: cmake -S . -B build -G Ninja -DNGBA_HOST_TESTS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: zip -r N-GBA-source.zip . -x './.git/*' './build/*' './build-mgba-host/*' './third_party/mgba/src/*'
      - uses: actions/upload-artifact@v4
        with:
          name: N-GBA-source
          path: N-GBA-source.zip

  mgba-upstream-host-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git build-essential
      - run: scripts/fetch-core.sh
      - run: scripts/build-mgba-host.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mGBA-host-build-log-and-config
          path: build-mgba-host/CMakeCache.txt

  symbian-platform-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.SYMBIAN_PLATFORM_SDK_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install symbian-platform
      - run: symbian doctor
      - run: symbian toolchain probe
      - run: echo 'SDK is available for the next target-build stage; N-GBA SIS packaging is not yet implemented.'

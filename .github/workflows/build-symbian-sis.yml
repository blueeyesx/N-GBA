
name: N-GBA - Symbian SIS/SISX Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build N-GBA for Symbian EKA2
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. Download source N-GBA
      - name: Checkout N-GBA
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            tar \
            gzip \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libssl-dev \
            zlib1g-dev

          python -m pip install --upgrade pip
          python -m pip install symbian-platform

      # 4. Check Symbian CLI
      - name: Check Symbian platform
        shell: bash
        run: |
          set -euo pipefail

          symbian --help
          symbian doctor

      # 5. Check source files
      - name: Check N-GBA source
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo "Files:"
          ls -la

          if [ ! -f CMakeLists.txt ]; then
            echo "::error::CMakeLists.txt not found"
            exit 1
          fi

          if [ ! -f symbian.toml ]; then
            echo "::error::symbian.toml not found"
            exit 1
          fi

      # 6. Check SDK installation command
      - name: Check SDK commands
        shell: bash
        run: |
          set -euo pipefail
          symbian sdk --help
          symbian app --help
          symbian package --help

      # 7. Build application
      - name: Build N-GBA
        shell: bash
        run: |
          set -euo pipefail

          symbian toolchain probe

          symbian app build \
            --project "$GITHUB_WORKSPACE"

      # 8. Locate generated E32 executable
      - name: Find E32 executable
        id: find-e32
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for E32 executable..."

          find . -type f -name '*.exe' -print

          mapfile -t FILES < <(
            find .symbian -type f -name '*.exe' | sort
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No E32 executable generated"
            exit 1
          fi

          E32="${FILES[0]}"

          echo "Found: $E32"
          echo "file=$E32" >> "$GITHUB_OUTPUT"

          symbian inspect --format e32 "$E32"

      # 9. Generate SIS package
      - name: Generate SIS package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/.symbian/package"

          symbian package \
            --project "$GITHUB_WORKSPACE" \
            --artifact "${{ steps.find-e32.outputs.file }}" \
            --output "$GITHUB_WORKSPACE/.symbian/package"

          echo "Generated packages:"
          find .symbian/package -type f -print

      # 10. Verify SIS package
      - name: Verify SIS package
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SIS_FILES < <(
            find .symbian/package -type f -name '*.sis' | sort
          )

          if [ "${#SIS_FILES[@]}" -eq 0 ]; then
            echo "::error::No SIS package generated"
            exit 1
          fi

          for SIS in "${SIS_FILES[@]}"; do
            echo "Inspecting $SIS"
            symbian inspect --format sis "$SIS"
          done

      # 11. Upload SIS/SISX artifacts
      - name: Upload SIS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N-GBA-Symbian-SIS-SISX
          path: |
            .symbian/package/*.sis
            .symbian/package/*.sisx
            .symbian/package/*.json
          if-no-files-found: error
          retention-days: 30

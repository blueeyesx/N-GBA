
name: N-GBA - Build Symbian SIS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build N-GBA SIS/SISX
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout N-GBA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            tar \
            gzip \
            build-essential \
            pkg-config

      - name: Install symbian-platform CLI
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install "symbian-platform==0.3.0"
          symbian --help
          symbian doctor

      - name: Download native Symbian SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_URL="https://github.com/hpnkv/symbian-platform/releases/download/v0.3.0/symbian-sdk-0.3.0-linux-x86_64.tar.gz"

          curl -fL "$SDK_URL" \
            -o "$RUNNER_TEMP/symbian-sdk.tar.gz"

          mkdir -p "$RUNNER_TEMP/symbian-sdk"

          symbian sdk install \
            "$RUNNER_TEMP/symbian-sdk" \
            --archive "$RUNNER_TEMP/symbian-sdk.tar.gz"

          echo "SYMBIAN_SDK=$RUNNER_TEMP/symbian-sdk" >> "$GITHUB_ENV"

      - name: Verify SDK
        shell: bash
        run: |
          set -euxo pipefail

          symbian doctor
          symbian toolchain probe

          echo "SDK installed:"
          find "$SYMBIAN_SDK" -maxdepth 2 -type f | head -100

      - name: Verify N-GBA project
        shell: bash
        run: |
          set -euxo pipefail

          test -f CMakeLists.txt
          test -f symbian.toml

          echo "Project files:"
          ls -la

          echo "Symbian configuration:"
          cat symbian.toml

      - name: Build N-GBA ARM application
        shell: bash
        run: |
          set -euxo pipefail

          symbian app build \
            --project "$GITHUB_WORKSPACE"

      - name: Inspect E32 executable
        id: e32
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching E32 executable..."

          find .symbian -type f -name '*.exe' -print

          mapfile -t EXES < <(
            find .symbian/build -type f -name '*.exe' | sort
          )

          if [ "${#EXES[@]}" -eq 0 ]; then
            echo "::error::E32 executable not found"
            exit 1
          fi

          E32="${EXES[0]}"

          echo "E32=$E32"
          echo "path=$E32" >> "$GITHUB_OUTPUT"

          symbian inspect --format e32 "$E32"

      - name: Create SIS installer
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .symbian/package

          symbian package \
            --project "$GITHUB_WORKSPACE" \
            --artifact "${{ steps.e32.outputs.path }}" \
            --output "$GITHUB_WORKSPACE/.symbian/package"

          echo "Package files:"
          find .symbian/package -type f -print

      - name: Verify SIS installer
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SIS_FILES < <(
            find .symbian/package -type f -name '*.sis' | sort
          )

          if [ "${#SIS_FILES[@]}" -eq 0 ]; then
            echo "::error::SIS file was not generated"
            exit 1
          fi

          for SIS in "${SIS_FILES[@]}"; do
            echo "Inspecting $SIS"
            symbian inspect --format sis "$SIS"
          done

      - name: Upload SIS/SISX
        uses: actions/upload-artifact@v4
        with:
          name: N-GBA-Symbian-SISX
          path: |
            .symbian/package/*.sis
            .symbian/package/package-report.json
          if-no-files-found: error
          retention-days: 30
